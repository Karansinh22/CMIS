version: "3.9"

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cmis_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/cmis.db
      - UPLOAD_DIR=/data/uploads
      - LSH_INDEX_PATH=/data/lsh_index.pkl
      - HF_TOKEN=${HF_TOKEN:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - DIARIZATION_ENABLED=${DIARIZATION_ENABLED:-true}
      - DEBUG=${DEBUG:-false}
    volumes:
      - cmis_data:/data
      - ./backend:/app          # hot-reload in dev
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # ── PostgreSQL (opt-in — uncomment to use instead of SQLite) ──────────────
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: cmis_postgres
  #   environment:
  #     POSTGRES_USER: cmis
  #     POSTGRES_PASSWORD: devpass
  #     POSTGRES_DB: cmis
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  cmis_data:
